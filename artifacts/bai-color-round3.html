<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>bai 渠道配色候选（claudecode=品牌橙、Codex=梅子紫已定）— GoGauge</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#e8eaf0; padding:24px; color:#1f2937; }
  h1 { font-size:20px; margin-bottom:6px; }
  .sub { font-size:13px; color:#6b7280; margin-bottom:18px; line-height:1.6; }
  .row { background:#fff; border:1px solid #d1d5db; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .row-h { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .row-h .name { font-size:15px; font-weight:600; }
  .row-h .hexes { font-family:Consolas,monospace; font-size:12px; color:#6b7280; }
  .verdict { font-size:12px; border-radius:6px; padding:2px 8px; }
  .v-ok { background:#dcfce7; color:#166534; } .v-warn { background:#fef9c3; color:#854d0e; } .v-bad { background:#fee2e2; color:#991b1b; }
  .panels { display:flex; gap:12px; flex-wrap:wrap; }
  .panel { flex:1 1 380px; border-radius:10px; padding:12px; }
  .panel.light { background:#ffffff; border:1px solid #e5e7eb; }
  .panel.dark { background:#1a1a1c; border:1px solid #2a2a2c; color:#e8e8ea; }
  .panel .tag { font-size:11px; opacity:.55; margin-bottom:8px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; margin-bottom:10px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .stack { display:flex; height:26px; border-radius:5px; overflow:hidden; margin-bottom:10px; }
  .stack div { height:100%; }
  .tbl { width:100%; font-size:12px; border-collapse:collapse; margin-bottom:8px; }
  .tbl td { padding:3px 6px; border-bottom:1px solid rgba(128,128,128,.18); }
  .chname { font-weight:600; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; font-size:11px; }
  .badge { border-radius:6px; padding:2px 7px; font-family:Consolas,monospace; }
  .panel.light .badge { color:#374151; background:rgba(0,0,0,.06); }
  .panel.dark .badge { color:#d4d4d8; background:rgba(255,255,255,.08); }
  .badge.b-ok { box-shadow:inset 0 0 0 1px rgba(34,197,94,.55); }
  .badge.b-warn { box-shadow:inset 0 0 0 1px rgba(245,158,11,.6); }
  .badge.b-bad { box-shadow:inset 0 0 0 1px rgba(239,68,68,.6); }
</style>
</head>
<body>
<h1>bai 渠道配色候选 <span style="font-size:13px;font-weight:400;color:#6b7280">（claudecode=品牌橙 #C2410C/#D97757、Codex=梅子紫 #C026D3/#D946EF 已定）</span></h1>
<div class="sub">
  问题定位：bai 现状琥珀 <b>#f59e0b 双主题同值</b>——亮主题距品牌橙 106 达标；<b>暗主题距橙 #D97757 仅 90</b>（低于 100 线），撞色点在暗色。
  每行：图例条 → bai 紧贴 claudecode 橙的堆叠柱（最严苛场景）→ 明细表文字 → 实时徽标。
</div>
<div id="rows"></div>
<script>
const dist=(a,b)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const[r1,g1,b1]=p(a),[r2,g2,b2]=p(b);return Math.hypot(r1-r2,g1-g2,b1-b2);};
const lum=h=>{const f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4;};const[r,g,b]=h.match(/\w\w/g).map(x=>f(parseInt(x,16)));return .2126*r+.7152*g+.0722*b;};
const contrast=(a,b)=>{const[l1,l2]=[lum(a),lum(b)].sort((x,y)=>y-x);return(l1+.05)/(l2+.05);};

/* 定局: claudecode 品牌橙 + Codex 梅子紫; bai 为变量 */
const FIXED_L={commandcode:"#10b981",zcode:"#6366f1",opencode:"#4f8ef7",dsh:"#64748b",claudecode:"#c2410c",codex:"#c026d3"};
const FIXED_D={commandcode:"#34d399",zcode:"#818cf8",opencode:"#6ba3ff",dsh:"#94a3b8",claudecode:"#d97757",codex:"#d946ef"};
const STACK=[["claudecode",22],["bai",14],["codex",24],["zcode",26],["commandcode",14]];
const TOTAL=STACK.reduce((s,[,v])=>s+v,0);

const ROWS=[
 {name:"基线 · 现状琥珀（双主题同值）#F59E0B", bai:{l:"#f59e0b",d:"#f59e0b"},
  note:"亮主题 106 达标；暗主题距品牌橙 90 越线——本次要解决的撞色点", verdict:["v-warn","暗主题撞橙 90"]},
 {name:"推荐 · 金黄分档：亮保持 #F59E0B / 暗提亮 #FACC15", bai:{l:"#f59e0b",d:"#facc15"},
  note:"最小改动：亮主题本就达标不动；暗色换成 tailwind yellow-400 金黄，距橙 90→113 转达标，对比度 8.09→11.35 更醒目。金黄与陶土橙色相相邻但明度差大（亮金 vs 焙陶棕）", verdict:["v-ok","全指标达标"]},
 {name:"全黄降档 #EAB308（双主题同值）", bai:{l:"#eab308",d:"#eab308"},
  note:"距离最远（亮 121/暗 101），但亮主题白卡文字对比仅 1.92，明细表里 bai 名几乎看不清", verdict:["v-bad","亮主题文字不可读"]},
 {name:"青柠 #84CC16(亮) / #A3E635(暗)", bai:{l:"#84cc16",d:"#a3e635"},
  note:"距离全达标且与橙拉得很开；但亮主题文字对比 1.98 不可读，且暗主题距 commandcode 翡翠绿仅约 87——绿区已有主", verdict:["v-bad","文字不可读+撞绿"]},
];

const root=document.getElementById("rows");
for(const r of ROWS){
  const row=document.createElement("div"); row.className="row";
  const allL={...FIXED_L, bai:r.bai.l}, allD={...FIXED_D, bai:r.bai.d};
  const near=(light)=>{
    const fam=light?FIXED_L:FIXED_D, v=light?r.bai.l:r.bai.d;
    const k=Object.keys(fam).reduce((a,b)=>dist(v,fam[a])<dist(v,fam[b])?a:b);
    return [k, dist(v,fam[k])];
  };
  const con=(light)=>contrast(light?r.bai.l:r.bai.d, light?"#ffffff":"#1a1a1c");
  const mark=(v,thr)=>v>=thr?"b-ok":(v>=thr*0.7?"b-warn":"b-bad");
  const legend=k=>Object.entries(k).map(([n,c])=>`<span><i class="dot" style="background:${c}"></i>${n==="codex"?"Codex":n}</span>`).join("");
  const stack=c=>STACK.map(([n,v])=>`<div style="width:${v/TOTAL*100}%;background:${c[n]}" title="${n} ${v}%"></div>`).join("");
  const tbl=c=>`<table class="tbl"><tr><td class="chname" style="color:${c.bai}">bai</td><td>41.0k</td><td>¥0.0241</td></tr><tr><td class="chname" style="color:${c.claudecode}">claudecode</td><td>565.4k</td><td>¥138.16</td></tr><tr><td class="chname" style="color:${c.codex}">Codex</td><td>57.69M</td><td>—</td></tr></table>`;
  const badges=(light)=>{
    const [nk,nd]=near(light);
    return `
      <span class="badge ${mark(nd,100)}">距最近 ${nk} ${Math.round(nd)} (线100)</span>
      <span class="badge ${mark(con(light),4.5)}">bai 文字对比 ${con(light).toFixed(2)} (线4.5)</span>
      <span class="badge ${mark(dist(light?r.bai.l:r.bai.d, light?"#c2410c":"#d97757"),100)}">距 claudecode 橙 ${Math.round(dist(light?r.bai.l:r.bai.d, light?"#c2410c":"#d97757"))}</span>
      <span class="badge ${mark(dist(light?r.bai.l:r.bai.d, light?"#10b981":"#34d399"),100)}">距 commandcode 绿 ${Math.round(dist(light?r.bai.l:r.bai.d, light?"#10b981":"#34d399"))}</span>`;
  };
  row.innerHTML=`
    <div class="row-h"><span class="name">${r.name}</span><span class="verdict ${r.verdict[0]}">${r.verdict[1]}</span></div>
    <div class="sub" style="margin:0 0 10px">${r.note}</div>
    <div class="panels">
      <div class="panel light"><div class="tag">亮色主题</div><div class="legend">${legend(allL)}</div>
        <div class="stack">${stack(allL)}</div>${tbl(allL)}<div class="badges">${badges(true)}</div></div>
      <div class="panel dark"><div class="tag">暗色主题</div><div class="legend">${legend(allD)}</div>
        <div class="stack">${stack(allD)}</div>${tbl(allD)}<div class="badges">${badges(false)}</div></div>
    </div>`;
  root.appendChild(row);
}
</script>
</body>
</html>
